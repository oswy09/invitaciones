<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Laura & Marco · Sinfonía Clásica · 19.06.2027</title>

    <!-- Google Fonts: Cormorant Garamond + Cinzel + Pinyon Script + Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Reset & Base ────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        background-color: #FAF8F5;
        color: #24201D;
      }
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #FAF8F5;
        font-family: var(--f-body);
        -webkit-font-smoothing: antialiased;
      }
      img, svg {
        display: block;
        max-width: 100%;
      }
      button {
        cursor: pointer;
        font: inherit;
        border: none;
        background: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /* ── Design Tokens ───────────────────────────────────────── */
      :root {
        --c-bg:           #FAF8F5; /* Marfil / Algodón clásico */
        --c-surface:      #F5F0E8; /* Cartulina texturizada cálida */
        --c-surface-card: #FFFFFF; /* Papel interior puro */
        --c-gold:         #9E7B3B; /* Oro antiguo señorial */
        --c-gold-light:   #C5A869; /* Oro resplandor */
        --c-gold-subtle:  #E8DCBE; /* Filigrana oro tenue */
        --c-text:         #231F1C; /* Tinta carbón renacentista */
        --c-muted:        #685F56; /* Tinta sepia suave */
        --c-olive:        #5A6048; /* Verde oliva clásico */
        --c-border:       #DECDB0; /* Borde y filete fino */
        --c-ribbon:       #FAF9F6; /* Seda blanca perlada */
        --c-ribbon-shadow:#D9CEB8;

        --f-display: 'Cinzel', 'Playfair Display', serif;
        --f-roman:   'Cormorant Garamond', Georgia, serif;
        --f-script:  'Pinyon Script', 'Great Vibes', cursive;
        --f-body:    'Montserrat', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
