    <!-- Twitter / X -->

    <!-- Preload Assets del Sobre para aparición instantánea en el 1er frame -->
    <link rel="preload" as="image" href="/img/sobre-solo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/img/mono-solo.png" fetchpriority="high" />

    <!-- Google Fonts: Cormorant Garamond + Cinzel + Pinyon Script + Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Reset & Base ────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        background-color: #FAF8F5;
        color: #24201D;
      }
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #FAF8F5;
        font-family: var(--f-body);
        -webkit-font-smoothing: antialiased;
      }
      img, svg {
        display: block;
        max-width: 100%;
      }
      button {
        cursor: pointer;
        font: inherit;
        border: none;
        background: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /* ── Design Tokens ───────────────────────────────────────── */
      :root {
        --c-bg:           #FCFAF7; /* Marfil puro / Algodón clásico */
        --c-surface:      #F7F3EB; /* Cartulina texturizada cálida */
        --c-surface-card: #FFFFFF; /* Papel interior puro */
        --c-gold:         #8A6529; /* Oro antiguo señorial con más contraste */
        --c-gold-light:   #B89552; /* Oro resplandor */
        --c-gold-subtle:  #D8C6A5; /* Filigrana oro tenue */
        --c-text:         #181411; /* Tinta carbón renacentista profunda y nítida */
        --c-muted:        #3E342B; /* Tinta sepia oscura y muy legible */
        --c-olive:        #4A5239; /* Verde oliva clásico */
        --c-border:       #D8C7AA; /* Borde y filete fino */
        --c-ribbon:       #FAF9F6; /* Seda blanca perlada */
        --c-ribbon-shadow:#D9CEB8;

        --f-display: 'Cinzel', 'Playfair Display', serif;
        --f-roman:   'Cormorant Garamond', Georgia, serif;
        --f-script:  'Pinyon Script', 'Great Vibes', cursive;
        --f-body:    'Montserrat', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
